[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aws-config = "1"
aws-credential-types = "1"
aws_lambda_events = { version = "1", default-features = false, features = ["sqs"] }
aws-sdk-ecs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1"
aws-smithy-runtime-api = "1"
base64 = "0.23"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
http = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
lambda_http = { version = "1", features = ["pass_through"] }
lambda_runtime = "1"
lru = "0.18"
metrics = "0.24"
metrics_cloudwatch_embedded = { version = "0.10", features = ["lambda"] }
octocrab = "0.54"
parking_lot = "0.12"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strum = { version = "0.28", features = ["derive"] }
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
