name: Build master and deploy to lambda

on:
  push:
    branches: master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run checks
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Install Cargo Lambda via pip
        run: pip install cargo-lambda

      - name: Get build secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "fafecebc-b41d-496d-915f-5ce536a6644b"
          project-slug: "publish"
          env-slug: "prod"

      - name: Build Lambda function orchestrator
        run: cargo lambda build --package ref-sync-orchestrator --release --output-format zip

      - name: Build Lambda function webhook
        run: cargo lambda build --package ref-sync-webhook --release --output-format zip

      - name: Get aws secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "fafecebc-b41d-496d-915f-5ce536a6644b"
          project-slug: "aws"
          env-slug: "prod"

      - name: Configure AWS credentials orchestrator
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_ORCHESTRATOR: ${{ env.AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_ORCHESTRATOR }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_ORCHESTRATOR }}"
          role-session-name: "ref-sync-orchestrator-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Update lambda code for orchestrator
        run: |
          aws lambda update-function-code \
            --function-name stock-trek-ref-sync-orchestrator \
            --zip-file fileb://target/lambda/stock-trek-ref-sync-orchestrator/bootstrap.zip

      - name: Configure AWS credentials webhook
        uses: aws-actions/configure-aws-credentials@v6
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_WEBHOOK: ${{ env.AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_WEBHOOK }}
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_UPDATE_LAMBDA_REF_SYNC_WEBHOOK }}"
          role-session-name: "ref-sync-webhook-${{ github.run_id }}"
          retry-max-attempts: 3
          mask-aws-account-id: true

      - name: Update lambda code for webhook
        run: |
          aws lambda update-function-code \
            --function-name stock-trek-ref-sync-webhook \
            --zip-file fileb://target/lambda/stock-trek-ref-sync-webhook/bootstrap.zip
